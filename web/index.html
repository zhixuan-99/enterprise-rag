<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云策知识库 · 多智能体问答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <span class="brand-name">云策知识库</span>
      <span class="brand-sub">KNOWLEDGE&nbsp;CONSOLE</span>
    </div>
    <div class="topbar-right">
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">系统就绪</span>
      </div>
    </div>
  </header>

  <!-- 主布局 -->
  <div class="layout">
    <!-- 左栏 -->
    <aside class="sidebar">
      <section class="panel">
        <h2 class="panel-title"><span class="panel-index">01</span>历史记录</h2>
        <div class="history-search">
          <input type="text" id="history-search" placeholder="搜索历史…">
        </div>
        <div class="history-list" id="history-list"></div>
        <div class="history-pager" id="history-pager"></div>
        <button class="history-clear" id="history-clear">清空历史</button>
      </section>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <div class="hero">
        <h1 class="hero-title">向知识库提问</h1>
      </div>

      <!-- 控制行：新对话 -->
      <div class="controls-row">
        <button class="new-chat-btn" id="new-chat">＋ 新对话</button>
      </div>

      <!-- 示例问题 -->
      <div class="examples">
        <button class="example-chip">帮我对比免费版和专业版，再给个购买建议</button>
        <button class="example-chip">报销的流程是什么？</button>
        <button class="example-chip">专业版每人每月多少钱？</button>
      </div>

      <!-- 对话区 -->
      <div class="chat" id="chat" aria-live="polite"></div>

      <!-- 输入区 -->
      <div class="composer">
        <textarea id="input" placeholder="输入你的问题，回车发送…" rows="1"></textarea>
        <button id="send" class="send-btn" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
